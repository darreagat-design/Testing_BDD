<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio de sesión | Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-panel">
    <p class="eyebrow">SISTEMA DEMO</p>
    <h1>Inicio de sesión</h1>
    <p class="intro">Ingresa tus credenciales para continuar.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" autocomplete="username" placeholder="nombre@ejemplo.com">
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña">
      </div>

      <button id="login-button" type="submit">Iniciar sesión</button>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
